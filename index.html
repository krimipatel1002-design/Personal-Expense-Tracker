<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            margin-bottom: 24px;
            color: #333333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666666;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #007bff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover { background-color: #0056b3; }
        .btn:disabled { background-color: #8bb9ee; cursor: not-allowed; }

        .error-msg {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .config-box {
            display: none;
            background: #fff3cd;
            color: #664d03;
            border: 1px solid #ffecb5;
            padding: 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .config-box p { margin-bottom: 14px; }

        .reset-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }

        .reset-link a { color: #007bff; }

        /* Dashboard Styles */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .dashboard header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            gap: 10px;
        }

        .logout-btn {
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .summary-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 140px;
            padding: 20px;
            border-radius: 6px;
            color: white;
        }

        .card.income { background-color: #28a745; }
        .card.expense { background-color: #dc3545; }
        .card.balance { background-color: #17a2b8; }

        .transaction-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .transaction-form input, .transaction-form select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            flex: 1;
            min-width: 120px;
        }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        table th, table td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        table th { background-color: #f8f9fa; }

        .type-income { color: green; text-transform: capitalize; }
        .type-expense { color: red; text-transform: capitalize; }

        .delete-btn {
            background: none;
            border: none;
            color: red;
            cursor: pointer;
        }

        .empty-row td { text-align: center; color: #999; }

        .status-msg {
            font-size: 14px;
            color: #dc3545;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div class="login-container" id="loginSection">
        <h2>Personal Expense Tracker</h2>
        <form class="config-box" id="configForm" onsubmit="saveConfig(event)">
            <p>First-time setup: paste your Supabase details (Supabase dashboard → Project Settings → API).</p>
            <div class="form-group">
                <label for="cfgUrl">Project URL</label>
                <input type="url" id="cfgUrl" required placeholder="https://xxxx.supabase.co">
            </div>
            <div class="form-group">
                <label for="cfgKey">Anon public key</label>
                <input type="text" id="cfgKey" required placeholder="eyJ...">
            </div>
            <button type="submit" class="btn">Save &amp; Continue</button>
        </form>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter email" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter Password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="loginBtn">Login</button>
            <div class="error-msg" id="errorMsg">Invalid email or password</div>
        </form>
        <p class="reset-link" id="resetLink"><a href="#" onclick="resetConfig(event)">Change Supabase settings</a></p>
    </div>

    <!-- Dashboard Section -->
    <div class="dashboard" id="dashboardSection">
        <header>
            <h2>Welcome, <span id="userName">KP</span>!</h2>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </header>

        <div class="summary-cards">
            <div class="card income">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0</p>
            </div>
            <div class="card expense">
                <h3>Total Expenses</h3>
                <p id="totalExpense">₹0</p>
            </div>
            <div class="card balance">
                <h3>Balance</h3>
                <p id="netBalance">₹0</p>
            </div>
        </div>

        <div class="status-msg" id="statusMsg"></div>

        <form class="transaction-form" onsubmit="addTransaction(event)">
            <input type="text" id="desc" placeholder="Description" required>
            <input type="number" id="amount" placeholder="Amount (₹)" required min="0.01" step="0.01">
            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <button type="submit" class="btn" id="addBtn" style="width: auto; padding: 10px 20px;">Add</button>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transactionList"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script>
        // Optional: paste your details here, or just enter them on the page the first time you open it.
        const SUPABASE_URL = "";
        const SUPABASE_ANON_KEY = "";

        function getConfig() {
            let url = SUPABASE_URL;
            let key = SUPABASE_ANON_KEY;
            if (!url || !key) {
                try {
                    url = localStorage.getItem('sb_url') || '';
                    key = localStorage.getItem('sb_key') || '';
                } catch (err) { /* storage unavailable */ }
            }
            return { url, key };
        }

        const cfg = getConfig();
        let db = null;
        if (cfg.url && cfg.key) {
            try {
                db = window.supabase.createClient(cfg.url, cfg.key);
            } catch (err) {
                console.error('Invalid Supabase settings:', err);
            }
        }

        function applyConfigView() {
            const ok = !!db;
            document.getElementById('configForm').style.display = ok ? 'none' : 'block';
            document.getElementById('loginForm').style.display = ok ? 'block' : 'none';
            document.getElementById('resetLink').style.display = ok ? 'block' : 'none';
        }

        function saveConfig(e) {
            e.preventDefault();
            const url = document.getElementById('cfgUrl').value.trim().replace(/\/+$/, '');
            const key = document.getElementById('cfgKey').value.trim();
            try {
                localStorage.setItem('sb_url', url);
                localStorage.setItem('sb_key', key);
            } catch (err) { /* storage unavailable */ }
            location.reload();
        }

        function resetConfig(e) {
            e.preventDefault();
            try {
                localStorage.removeItem('sb_url');
                localStorage.removeItem('sb_key');
            } catch (err) { /* storage unavailable */ }
            location.reload();
        }

        let transactions = [];

        const $ = (id) => document.getElementById(id);

        function formatAmount(n) {
            return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
        }

        function showStatus(msg) {
            const el = $('statusMsg');
            el.textContent = msg || '';
            el.style.display = msg ? 'block' : 'none';
        }

        function showDashboard(user) {
            $('loginSection').style.display = 'none';
            $('dashboardSection').style.display = 'block';
            $('userName').textContent = user.email;
            loadTransactions();
        }

        function showLogin() {
            $('dashboardSection').style.display = 'none';
            $('loginSection').style.display = 'block';
            $('loginForm').reset();
            $('errorMsg').style.display = 'none';
            transactions = [];
            $('transactionList').innerHTML = '';
        }

        async function handleLogin(e) {
            e.preventDefault();
            if (!db) return;
            const btn = $('loginBtn');
            btn.disabled = true;
            $('errorMsg').style.display = 'none';

            const { data, error } = await db.auth.signInWithPassword({
                email: $('email').value.trim(),
                password: $('password').value
            });

            btn.disabled = false;
            if (error || !data.user) {
                $('errorMsg').style.display = 'block';
                return;
            }
            showDashboard(data.user);
        }

        async function handleLogout() {
            await db.auth.signOut();
            showLogin();
        }

        async function loadTransactions() {
            showStatus('');
            const { data, error } = await db
                .from('transactions')
                .select('id, description, amount, type')
                .order('created_at', { ascending: false });

            if (error) {
                showStatus('Could not load transactions: ' + error.message);
                return;
            }
            transactions = data;
            renderDashboard();
        }

        async function addTransaction(e) {
            e.preventDefault();
            const description = $('desc').value.trim();
            const amount = parseFloat($('amount').value);
            const type = $('type').value;

            if (!description || !isFinite(amount) || amount <= 0) return;

            const btn = $('addBtn');
            btn.disabled = true;
            showStatus('');

            const { error } = await db
                .from('transactions')
                .insert({ description, amount, type });

            btn.disabled = false;
            if (error) {
                showStatus('Could not add transaction: ' + error.message);
                return;
            }
            $('desc').value = '';
            $('amount').value = '';
            loadTransactions();
        }

        async function deleteTransaction(id) {
            showStatus('');
            const { error } = await db.from('transactions').delete().eq('id', id);
            if (error) {
                showStatus('Could not delete transaction: ' + error.message);
                return;
            }
            loadTransactions();
        }

        function renderDashboard() {
            const list = $('transactionList');
            list.innerHTML = '';

            let income = 0;
            let expense = 0;

            if (transactions.length === 0) {
                const tr = document.createElement('tr');
                tr.className = 'empty-row';
                const td = document.createElement('td');
                td.colSpan = 4;
                td.textContent = 'No transactions yet';
                tr.appendChild(td);
                list.appendChild(tr);
            }

            transactions.forEach((t) => {
                const amt = Number(t.amount);
                if (t.type === 'income') income += amt; else expense += amt;

                const tr = document.createElement('tr');

                const tdDesc = document.createElement('td');
                tdDesc.textContent = t.description; // textContent prevents XSS

                const tdAmount = document.createElement('td');
                tdAmount.textContent = formatAmount(amt);

                const tdType = document.createElement('td');
                tdType.textContent = t.type;
                tdType.className = t.type === 'income' ? 'type-income' : 'type-expense';

                const tdAction = document.createElement('td');
                const btn = document.createElement('button');
                btn.className = 'delete-btn';
                btn.textContent = 'Delete';
                btn.addEventListener('click', () => deleteTransaction(t.id));
                tdAction.appendChild(btn);

                tr.append(tdDesc, tdAmount, tdType, tdAction);
                list.appendChild(tr);
            });

            $('totalIncome').textContent = formatAmount(income);
            $('totalExpense').textContent = formatAmount(expense);
            $('netBalance').textContent = formatAmount(income - expense);
        }

        // Restore session on page load
        (async function init() {
            applyConfigView();
            if (!db) return;
            const { data } = await db.auth.getSession();
            if (data.session) showDashboard(data.session.user);
        })();
    </script>
</body>
</html>
